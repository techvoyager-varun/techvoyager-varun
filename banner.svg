<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0710"/>
      <stop offset="55%" stop-color="#150c28"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="320" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#bg)"/>

    <!-- radial speed lines, manga style -->
    <g stroke="#a78bfa" stroke-width="1" opacity="0.14">
      <line x1="450" y1="160" x2="-50" y2="-40"/>
      <line x1="450" y1="160" x2="0" y2="-60"/>
      <line x1="450" y1="160" x2="60" y2="-60"/>
      <line x1="450" y1="160" x2="950" y2="-40"/>
      <line x1="450" y1="160" x2="900" y2="-60"/>
      <line x1="450" y1="160" x2="840" y2="-60"/>
      <line x1="450" y1="160" x2="-60" y2="380"/>
      <line x1="450" y1="160" x2="0" y2="400"/>
      <line x1="450" y1="160" x2="950" y2="380"/>
      <line x1="450" y1="160" x2="900" y2="400"/>
    </g>

    <!-- scanning horizontal beam -->
    <rect x="0" y="0" width="900" height="4" fill="url(#beam)" opacity="0.6">
      <animate attributeName="y" values="0;316;0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- corner HUD brackets -->
    <g stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.8">
      <path d="M22 20 L22 44 M22 20 L46 20"/>
      <path d="M878 20 L878 44 M878 20 L854 20"/>
      <path d="M22 300 L22 276 M22 300 L46 300"/>
      <path d="M878 300 L878 276 M878 300 L854 300"/>
    </g>

    <!-- system readout top-left -->
    <text x="34" y="40" font-family="'Fira Code', monospace" font-size="12" fill="#7dd3fc" opacity="0.85" letter-spacing="1">
      SYS.BOOT :: PLAYER_PROFILE
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- LV badge top-right -->
    <g transform="translate(820,32)">
      <polygon points="0,-16 50,-16 58,0 50,16 0,16 -8,0" fill="none" stroke="#f472b6" stroke-width="1.6" opacity="0.9"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="14" fill="#f472b6">LV 99</text>
    </g>

    <!-- glitch title layers -->
    <text x="452" y="150" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-weight="700" font-size="64" fill="#60a5fa" opacity="0.55">
      VARUN RAWAT
      <animate attributeName="x" values="452;446;452;458;452" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="448" y="150" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-weight="700" font-size="64" fill="#f472b6" opacity="0.55">
      VARUN RAWAT
      <animate attributeName="x" values="448;454;448;442;448" dur="2.7s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="150" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-weight="700" font-size="64" fill="#f5f3ff" filter="url(#glow)">
      VARUN RAWAT
    </text>

    <!-- underline accent -->
    <rect x="330" y="168" width="240" height="3" fill="#a78bfa">
      <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.3;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- rotating system message -->
    <text x="450" y="215" text-anchor="middle" font-family="'Fira Code', monospace" font-size="18" fill="#cdd6f4" opacity="0">
      &gt; Full-Stack Engineer. Ships things that work.
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.22;0.27" dur="18s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="215" text-anchor="middle" font-family="'Fira Code', monospace" font-size="18" fill="#cdd6f4" opacity="0">
      &gt; Competitive coder. Breaks things on purpose first.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.24;0.29" dur="18s" begin="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="215" text-anchor="middle" font-family="'Fira Code', monospace" font-size="18" fill="#cdd6f4" opacity="0">
      &gt; Currently grinding System Design + Cloud.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.24;0.29" dur="18s" begin="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="215" text-anchor="middle" font-family="'Fira Code', monospace" font-size="18" fill="#cdd6f4" opacity="0">
      &gt; Status: OPEN FOR SWE INTERNSHIPS
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.24;0.29" dur="18s" begin="13.5s" repeatCount="indefinite"/>
    </text>

    <!-- XP bar -->
    <rect x="300" y="250" width="300" height="10" rx="5" fill="#1e1b33" stroke="#3b3260" stroke-width="1"/>
    <rect x="303" y="253" width="0" height="4" rx="2" fill="#a78bfa">
      <animate attributeName="width" values="0;288;288" keyTimes="0;0.6;1" dur="4s" fill="freeze"/>
    </rect>
    <text x="450" y="278" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#7dd3fc" letter-spacing="2" opacity="0.8">
      EXP :: BUILD.SHIP.REPEAT
    </text>

    <!-- floating particles -->
    <circle r="2" fill="#a78bfa" opacity="0.7">
      <animateMotion path="M100,300 C120,180 90,80 110,-10" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.6" fill="#f472b6" opacity="0.7">
      <animateMotion path="M800,300 C780,180 810,80 790,-10" dur="7.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="#60a5fa" opacity="0.7">
      <animateMotion path="M700,310 C720,200 690,90 710,-10" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#7dd3fc" opacity="0.7">
      <animateMotion path="M180,310 C160,200 190,90 170,-10" dur="9.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
