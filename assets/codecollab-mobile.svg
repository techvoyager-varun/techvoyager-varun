<rect width="1000" height="684" fill="#f2ede3"/><rect width="1000" height="420" fill="#dfb741"/><text x="40" y="46" font-size="16" class="mono" letter-spacing="1">02 / REALTIME COLLABORATIVE DEVELOPMENT</text><text x="37" y="141" font-size="82" font-weight="900" letter-spacing="-4">CodeCollab</text><text x="40" y="188" font-size="26" >Same room. Shared ideas. Better code.</text><rect x="40" y="225" width="920" height="157" fill="#23211e"/><g font-family="Consolas,monospace" font-size="23"><text x="68" y="269" fill="#dfb741">const <tspan fill="#f2ede3">workspace = {</tspan></text><text x="104" y="308" fill="#f2ede3">code: <tspan fill="#dfb741">"together"</tspan>, ideas: <tspan fill="#dfb741">"shared"</tspan></text><text x="68" y="348" fill="#f2ede3">};</text></g><path d="M675 302l0 28 9-8 7 14 8-4-7-14 12 0z" fill="#dfb741"/><rect x="718" y="317" width="116" height="31" fill="#dfb741"/><text x="730" y="339" font-size="17" class="mono">you + me</text><g class="moving"><rect x="844" y="249" width="3" height="25" fill="#f2ede3"><animate attributeName="opacity" values="1;1;0;0" dur="1.8s" repeatCount="indefinite"/></rect></g></g><text x="24" y="294" font-size="26" font-weight="700">A browser workspace for building</text><text x="24" y="329" font-size="26" font-weight="700">together, in real time.</text><text x="24" y="381" font-size="26" >Shared Monaco editing, whiteboards,</text><text x="24" y="416" font-size="26" >terminals and WebRTC communication.</text><text x="24" y="468" font-size="26" >Project-aware AI assistance with vector</text><text x="24" y="503" font-size="26" >search and persistent state.</text><path d="M24 555H576" stroke="#b3aa9a"/><text x="24" y="594" font-size="23" >Next.js · Socket.IO · WebRTC</text><text x="24" y="627" font-size="23" >pgvector · Redis</text><text x="24" y="682" font-size="22" font-weight="700">EXPLORE THE SOURCE ↗</text></svg>