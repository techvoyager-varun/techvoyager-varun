<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="684" viewBox="0 0 1000 684" fill="#23211e" role="img" aria-labelledby="title"><title id="title">CodeCollab — realtime collaborative developer workspace. Shared editor, whiteboard, terminals, WebRTC and project-aware AI. Next.js, Socket.IO, pgvector, Redis.</title>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.serif{font-family:Georgia,serif}@media(prefers-reduced-motion:reduce){.moving{display:none}}</style>
<rect width="1000" height="684" fill="#f2ede3"/><rect width="1000" height="420" fill="#dfb741"/><text x="40" y="46" font-size="16" class="mono" letter-spacing="1">02 / REALTIME COLLABORATIVE DEVELOPMENT</text><text x="37" y="141" font-size="82" font-weight="900" letter-spacing="-4">CodeCollab</text><text x="40" y="188" font-size="26" >Same room. Shared ideas. Better code.</text><rect x="40" y="225" width="920" height="157" fill="#23211e"/><g font-family="Consolas,monospace" font-size="23"><text x="68" y="269" fill="#dfb741">const <tspan fill="#f2ede3">workspace = {</tspan></text><text x="104" y="308" fill="#f2ede3">code: <tspan fill="#dfb741">"together"</tspan>, ideas: <tspan fill="#dfb741">"shared"</tspan></text><text x="68" y="348" fill="#f2ede3">};</text></g><path d="M675 302l0 28 9-8 7 14 8-4-7-14 12 0z" fill="#dfb741"/><rect x="718" y="317" width="116" height="31" fill="#dfb741"/><text x="730" y="339" font-size="17" class="mono">you + me</text><g class="moving"><rect x="844" y="249" width="3" height="25" fill="#f2ede3"><animate attributeName="opacity" values="1;1;0;0" dur="1.8s" repeatCount="indefinite"/></rect></g><text x="40" y="466" font-size="26" font-weight="700">A browser workspace for building together, in real time.</text><text x="40" y="502" font-size="22" >Shared Monaco editing, whiteboards, terminals and WebRTC communication.</text><text x="40" y="539" font-size="22" >Project-aware AI assistance with vector search and persistent state.</text><path d="M40 569H960" stroke="#b3aa9a"/><text x="40" y="605" font-size="17" class="mono">NEXT.JS · SOCKET.IO · WEBRTC · PGVECTOR · REDIS</text><text x="40" y="648" font-size="19" font-weight="700" letter-spacing="1">EXPLORE THE SOURCE</text><text x="950" y="649" font-size="32" text-anchor="end">↗</text></svg>