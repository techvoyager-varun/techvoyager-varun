aste changes.</text><text x="24" y="376" font-size="26" >Neural collaborative filtering,</text><text x="24" y="411" font-size="26" >sequential transformers and adaptive</text><text x="24" y="446" font-size="26" >ranking.</text><text x="24" y="498" font-size="26" >Personalized discovery, watchlists and</text><text x="24" y="533" font-size="26" >explainable recommendations.</text><path d="M24 585H576" stroke="#b3aa9a"/><text x="24" y="624" font-size="23" >React · TypeScript · FastAPI</text><text x="24" y="657" font-size="23" >PyTorch · PostgreSQL</text><text x="24" y="712" font-size="22" font-weight="700">EXPLORE THE SOURCE ↗</text></svg>