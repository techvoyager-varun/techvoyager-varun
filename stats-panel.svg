<svg width="560" height="270" viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#150c28"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="560" height="270" rx="10" fill="url(#panelBg)" stroke="#2e2350" stroke-width="1.2"/>
  <text x="26" y="34" font-family="'Fira Code', monospace" font-weight="700" font-size="15" fill="#e0e7ff" letter-spacing="2">
    ▣ SKILL TREE
  </text>
  <line x1="26" y1="44" x2="534" y2="44" stroke="#2e2350" stroke-width="1"/>

  <!-- Frontend -->
  <text x="26" y="74" font-family="'Fira Code', monospace" font-size="13" fill="#cdd6f4">Frontend Development</text>
  <text x="534" y="74" text-anchor="end" font-family="'Fira Code', monospace" font-size="12" fill="#a78bfa">88%</text>
  <rect x="26" y="82" width="508" height="8" rx="4" fill="#1e1b33"/>
  <rect x="26" y="82" width="0" height="8" rx="4" fill="url(#bar1)">
    <animate attributeName="width" values="0;447" dur="1.6s" begin="0.1s" fill="freeze"/>
  </rect>

  <!-- Backend -->
  <text x="26" y="114" font-family="'Fira Code', monospace" font-size="13" fill="#cdd6f4">Backend Development</text>
  <text x="534" y="114" text-anchor="end" font-family="'Fira Code', monospace" font-size="12" fill="#f472b6">82%</text>
  <rect x="26" y="122" width="508" height="8" rx="4" fill="#1e1b33"/>
  <rect x="26" y="122" width="0" height="8" rx="4" fill="url(#bar2)">
    <animate attributeName="width" values="0;417" dur="1.6s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- DSA / CP -->
  <text x="26" y="154" font-family="'Fira Code', monospace" font-size="13" fill="#cdd6f4">Data Structures &amp; Algorithms</text>
  <text x="534" y="154" text-anchor="end" font-family="'Fira Code', monospace" font-size="12" fill="#34d399">85%</text>
  <rect x="26" y="162" width="508" height="8" rx="4" fill="#1e1b33"/>
  <rect x="26" y="162" width="0" height="8" rx="4" fill="url(#bar3)">
    <animate attributeName="width" values="0;432" dur="1.6s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- System Design -->
  <text x="26" y="194" font-family="'Fira Code', monospace" font-size="13" fill="#cdd6f4">System Design (leveling up)</text>
  <text x="534" y="194" text-anchor="end" font-family="'Fira Code', monospace" font-size="12" fill="#fbbf24">61%</text>
  <rect x="26" y="202" width="508" height="8" rx="4" fill="#1e1b33"/>
  <rect x="26" y="202" width="0" height="8" rx="4" fill="url(#bar4)">
    <animate attributeName="width" values="0;310" dur="1.6s" begin="0.7s" fill="freeze"/>
  </rect>

  <text x="26" y="240" font-family="'Fira Code', monospace" font-size="11" fill="#6c7086" letter-spacing="1">
    ⚡ auto-updates? no. hand-tuned by the developer himself.
  </text>
  <rect x="24" y="216" width="4" height="4" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
